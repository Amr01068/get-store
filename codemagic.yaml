workflows:
  android-release:
    name: Build Android Release APK
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$FLUTTER_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Get Flutter dependencies
        script: |
          flutter pub get
      - name: Patch plugins namespace and compileSdkVersion for AGP 8
        script: |
          find "$HOME/.pub-cache" -name "build.gradle" 2>/dev/null | while read -r file; do
            if grep -q "deviceapps" "$file"; then
              echo "Patching device_apps in $file"
              perl -pi -e 's/compileSdkVersion\s+\d+/compileSdkVersion 34/g' "$file"
              if ! grep -q "namespace" "$file"; then
                perl -pi -e 's/android\s*\{/android {\n    namespace "fr.g123k.deviceapps"/g' "$file"
              fi
              echo "=== Patched $file ==="
              cat "$file"
            fi
          done
      - name: Build Android Release APK
        script: |
          flutter build apk --release --android-skip-build-dependency-validation
    artifacts:
      - build/**/outputs/**/*.apk
